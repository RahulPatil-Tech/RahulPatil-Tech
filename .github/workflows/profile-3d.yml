name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contribution
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}  # Use Personal Access Token
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated"
          git push

      - name: Update Profile README
        run: |
          echo '<h1 align="center">🚀 Hi 👋, I\'m Rahul Patil</h1>' >> README.md
          echo '<h3 align="center">AI & Analytics Enthusiast | Innovator | Problem Solver</h3>' >> README.md
          echo '<p align="center"> <img src="https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=rahulpatil-tech&theme=radical" alt="Rahul Patil" /> </p>' >> README.md
          echo '' >> README.md
          echo '---' >> README.md
          echo '' >> README.md
          echo '## 🌟 About Me' >> README.md
          echo '- 🔬 Passionate about **AI-powered health tech** & **predictive analytics** ' >> README.md
          echo '- 🚀 Building **NUTRIFLEX**, a smart AI-driven nutrition assistant  ' >> README.md
          echo '- 💡 Exploring **LSTM, XGBoost, Deep Learning & Cloud Computing** ' >> README.md
          echo '- 🎯 Interested in **AI-driven investment strategies** & **gamified leadership** ' >> README.md
